name: Build SunDroid (EXE & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller

      - name: Build Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SunDroid" pc/client.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunDroid-Windows-EXE
          path: dist/SunDroid.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Accept Android Licenses & Build APK
        working-directory: ./android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SunDroid.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunDroid-Android-APK
          path: SunDroid.apk

  release:
    name: Publish Release (EXE & APK)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: SunDroid-Windows-EXE
          path: ./release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: SunDroid-Android-APK
          path: ./release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "☀️ SunDroid v1.0.0 (Ready to Install)"
          body: |
            ### ☀️ SunDroid — Reverse Sunshine & Moonlight
            
            Langsung download dan jalankan tanpa perlu compile source code:
            
            - 💻 **Windows PC:** Download `SunDroid.exe` (Tinggal klik 2x langsung jalan)
            - 📱 **Android Phone:** Download `SunDroid.apk` (Install langsung di HP)
          files: |
            ./release-assets/SunDroid.exe
            ./release-assets/SunDroid.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
